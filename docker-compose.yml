version: '3.8'

services:
  # 1. DATABASE (POSTGRESQL)
  postgres:
    image: postgres:15-alpine
    container_name: yt_tele_postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount file init.sql để tự động tạo bảng
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices_net

  # 2. CACHE & RATE LIMIT (REDIS)
  redis:
    image: redis:7-alpine
    container_name: yt_tele_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - microservices_net

  # 3. GIAO DIỆN QUẢN LÝ DB (PGADMIN) - Tùy chọn
  pgadmin:
    image: dpage/pgadmin4
    container_name: yt_tele_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - microservices_net

  # =========================================================
  # PHẦN SAU NÀY SẼ UNCOMMENT KHI CODE XONG CÁC MICROSERVICES
  # =========================================================
  # api_gateway:
  #   build: ./api_gateway
  #   container_name: api_gateway
  #   ports:
  #     - "8000:8000"
  #   env_file: .env
  #   depends_on: [postgres, redis]
  #   networks: [microservices_net]

  # auth_service:
  #   build: ./auth_service
  #   container_name: auth_service
  #   ports:
  #     - "8001:8000"
  #   ...

volumes:
  postgres_data:

networks:
  microservices_net:
    driver: bridge